name: Claude Skill Authority Windows PowerShell 5.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-claude-skill-authority.ps1'
      - '.github/workflows/claude-skill-authority-ps51-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-claude-skill-authority.ps1'
      - '.github/workflows/claude-skill-authority-ps51-ci.yml'

permissions:
  contents: read

concurrency:
  group: claude-skill-authority-ps51-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = (Resolve-Path '.\scripts\verify-claude-skill-authority.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw ('Windows PowerShell 5.1 parser rejected verify-claude-skill-authority.ps1: ' + (($errors | ForEach-Object { $_.Message }) -join '; '))
          }
      - name: Run authority self-test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\verify-claude-skill-authority.ps1 -SelfTest
