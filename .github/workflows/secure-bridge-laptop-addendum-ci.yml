name: Secure Bridge Laptop Addendum CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/windows-secure-bridge-verify.ps1'
      - 'src/claude/**'
      - 'src/goals/**'
      - 'src/orchestration/**'
      - 'src/safety/**'
      - 'src/verification/**'
      - 'src/dashboard/**'
      - 'package.json'
      - '.github/workflows/secure-bridge-laptop-addendum-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/windows-secure-bridge-verify.ps1'
      - 'src/claude/**'
      - 'src/goals/**'
      - 'src/orchestration/**'
      - 'src/safety/**'
      - 'src/verification/**'
      - 'src/dashboard/**'
      - 'package.json'
      - '.github/workflows/secure-bridge-laptop-addendum-ci.yml'

permissions:
  contents: read

concurrency:
  group: secure-bridge-laptop-addendum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-secure-bridge-addendum:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NEXUS_ALLOW_PAID_GENERATION: 'false'
      NEXUS_WATCHDOG_AUTO_RESTART: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node 22.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Parse-check Windows Secure Bridge verifier with Windows PowerShell
        shell: powershell
        run: |
          $path = (Resolve-Path '.\scripts\windows-secure-bridge-verify.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw ('Windows PowerShell parser rejected windows-secure-bridge-verify.ps1: ' + (($errors | ForEach-Object { $_.Message }) -join '; '))
          }
          Write-Host 'PASS windows-secure-bridge-verify.ps1 Windows PowerShell parse check.'
      - name: Run Secure Bridge Windows verification addendum
        run: npm run verify:secure-bridge-laptop
