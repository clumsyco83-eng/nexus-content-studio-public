name: Diagnose Secure Bridge Node 24

on:
  pull_request:
    paths:
      - 'src/testing/secure-bridge-node24-diagnostic.ts'
      - '.github/workflows/diagnose-secure-bridge-node24.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - run: npm ci
      - name: Reproduce sanitized Secure Bridge addendum
        run: npx.cmd tsx src/testing/secure-bridge-node24-diagnostic.ts
