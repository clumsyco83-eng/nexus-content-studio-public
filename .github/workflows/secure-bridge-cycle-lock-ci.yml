name: Secure Bridge Cycle Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secure-bridge-cycle-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cycle-lock:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run check
      - name: Verify fail-closed cross-process Secure Bridge cycle lock
        shell: powershell
        run: .\scripts\windows-secure-bridge-lock-verify.ps1
