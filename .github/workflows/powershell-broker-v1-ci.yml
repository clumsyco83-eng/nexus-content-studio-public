name: PowerShell Broker v1 CI

on:
  pull_request:
    paths:
      - 'src/powershell-broker/**'
      - 'src/testing/powershell-broker.ts'
      - 'src/testing/powershell-broker-v2.ts'
      - 'src/testing/powershell-broker-completion-v2.ts'
      - 'src/testing/sanitized-completion-v2-node24-diagnostic.ts'
      - 'scripts/powershell-broker-v1.ps1'
      - 'scripts/powershell-broker-completion-v2.ps1'
      - 'scripts/complete-core-specialist-promotion.ps1'
      - 'scripts/windows-laptop-verify-staged.ps1'
      - 'scripts/windows-broker-child-stderr-regression.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/powershell-broker-v1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run verify:powershell-broker

  windows-fixed-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - run: npm ci
      - name: Exercise fixed read-only process capability directly
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File scripts/powershell-broker-v1.ps1 -Capability system.process.inspect -ProcessName nexus-process-that-does-not-exist
          if ($LASTEXITCODE -ne 0) { throw "PowerShell Broker fixed-script regression failed with exit code $LASTEXITCODE" }
      - name: Exercise staged Windows verifier code mapping
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-laptop-verify-staged.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Staged Windows verifier self-test failed with exit code $LASTEXITCODE" }
      - name: Verify core-specialist native stderr classification
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/complete-core-specialist-promotion.ps1 -SelfTestNativeStderr
          if ($LASTEXITCODE -ne 0) { throw "Core-specialist native-stderr self-test failed with exit code $LASTEXITCODE" }
      - name: Verify broker child stderr classification
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-broker-child-stderr-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw "Broker child-stderr regression failed with exit code $LASTEXITCODE" }
      - name: Exercise Node to broker to system PowerShell integration
        run: npm run verify:powershell-broker
      - name: Switch to laptop Node 24.18 / npm 11
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Verify broker child stderr classification under Node 24.18 / npm 11
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-broker-child-stderr-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw "Broker child-stderr Node24 regression failed with exit code $LASTEXITCODE" }
      - name: Verify sanitized broker/npm TypeScript regression under Node 24.18
        run: npm run verify:powershell-broker
      - name: Verify full sanitized completion-v2 wrapper under Node 24.18
        run: npx.cmd tsx src/testing/sanitized-completion-v2-node24-diagnostic.ts
